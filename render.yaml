# Render Blueprint - web service only. Render's free tier has no free
# Background Worker or Cron Job service (Workers start at $7/mo, Cron Jobs
# have a $1/mo minimum) - see MIGRATION_QUICKSTART.md / project notes for why
# background work here runs as in-process threads instead (see
# assessments/views.py export_excel_async).
services:
  - type: web
    name: holistic-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health/
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false # Neon connection string - set in the Render dashboard, needs ?sslmode=require
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DEFAULT_DHIS2_INSTANCE
        value: https://dhims.chimgh.org/dhims
      - key: REDIS_URL
        sync: false # optional - Celery is wired but dormant (no tasks defined); leave unset unless needed
